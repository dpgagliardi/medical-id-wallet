<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="720" viewBox="0 0 1440 720">
  <!-- Connect IQ Store hero image for the Edge device app.
       photo-crop.jpg: generated road photo, cropped to 2:1 below
       the tyre lettering and scaled to 1440x720. The screen is an Edge 1040
       simulator capture (282x470 at 2x) with sample data; the device sits on
       the out-front mount of the generic bike computer in the photo.
       Render (the Store takes images under 150 KB, hence the JPG):
         rsvg-convert -w 1440 -h 720 edge-hero.svg -o /tmp/edge-hero.png
         magick /tmp/edge-hero.png -quality 85 -strip edge-hero.jpg -->
  <defs>
    <!-- Left side: extra depth of field and a light wash behind the copy -->
    <filter id="defocus" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.36" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#000000"/>
    </linearGradient>
    <mask id="leftMask">
      <rect width="1440" height="720" fill="url(#fade)"/>
    </mask>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7FAFD" stop-opacity="0.82"/>
      <stop offset="0.34" stop-color="#F7FAFD" stop-opacity="0.6"/>
      <stop offset="0.58" stop-color="#F7FAFD" stop-opacity="0"/>
    </linearGradient>

    <!-- Device materials -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3C42"/>
      <stop offset="0.08" stop-color="#25262B"/>
      <stop offset="1" stop-color="#18191C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A8F98"/>
      <stop offset="0.2" stop-color="#3A3C42"/>
      <stop offset="1" stop-color="#2A2B30"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="0" y="0" width="282" height="470" rx="6"/>
    </clipPath>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="6" dy="22" stdDeviation="20" flood-color="#0E1A12" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Photo, sharp on the right, defocused under the copy -->
  <image width="1440" height="720" xlink:href="photo-crop.jpg"/>
  <image width="1440" height="720" xlink:href="photo-crop.jpg"
         filter="url(#defocus)" mask="url(#leftMask)"/>
  <rect width="1440" height="720" fill="url(#wash)"/>

  <!-- Edge, scale 0.68, tilted to sit with the bars -->
  <g transform="translate(1004 248) rotate(-3) scale(0.68) translate(-141 -270)" filter="url(#shadow)">
    <rect x="-20" y="-34" width="322" height="580" rx="40" fill="url(#rim)"/>
    <rect x="-18" y="-32" width="318" height="576" rx="38" fill="url(#bezel)"/>
    <rect x="-6" y="-8" width="294" height="486" rx="10" fill="#000000"/>
    <image width="282" height="470" clip-path="url(#screen)" xlink:href="edge-screen-profile.png"/>
    <rect width="282" height="470" rx="6" fill="url(#glare)"/>
  </g>

  <!-- Copy -->
  <g font-family="Inter" fill="#101820">
    <g transform="translate(96 84)">
      <circle cx="17" cy="17" r="17" fill="#E0242B"/>
      <rect x="5.1" y="9.18" width="23.8" height="15.64" rx="2.72" fill="#FFFFFF"/>
      <path d="M12.24 21.42 C7.48 18.02 7.48 13.94 10.2 13.6 C11.39 13.43 12.24 14.28 12.24 15.13 C12.24 14.28 13.09 13.43 14.28 13.6 C17 13.94 17 18.02 12.24 21.42Z" fill="#E0242B"/>
      <rect x="18.02" y="13.6" width="7.82" height="2.38" rx="1.19" fill="#E0242B"/>
      <rect x="18.02" y="18.02" width="5.44" height="2.38" rx="1.19" fill="#E0242B"/>
      <text x="48" y="23.5" font-size="19" font-weight="600" letter-spacing="-0.2">Medical ID Wallet</text>
    </g>

    <text x="96" y="262" font-size="14" font-weight="600" letter-spacing="2.4" fill="#2F6B3F">FOR EDGE CYCLING COMPUTERS</text>
    <text x="96" y="338" font-size="62" font-weight="700" letter-spacing="-2.2">Your medical ID</text>
    <text x="96" y="410" font-size="62" font-weight="700" letter-spacing="-2.2">rides with you.</text>
    <text x="96" y="470" font-size="21" fill="#2B3540">Blood type, allergies and emergency contacts,</text>
    <text x="96" y="500" font-size="21" fill="#2B3540">right on your handlebar. Fully offline.</text>
  </g>
</svg>
