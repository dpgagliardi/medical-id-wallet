<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="720" viewBox="0 0 1440 720">
  <!-- Connect IQ Store hero image for the Edge device app. Screens are
       Edge 1040 simulator captures (282x470 at 2x) with sample data.
       Render: rsvg-convert -w 1440 -h 720 edge-hero.svg -o edge-hero.png -->
  <defs>
    <radialGradient id="glow" cx="1010" cy="380" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0242B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E0242B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272C"/>
      <stop offset="1" stop-color="#16171A"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="0" y="0" width="282" height="470" rx="6"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- Generic cycling computer: bezel 20 at the sides, 34 above, 76 below. -->
    <g id="device">
      <rect x="-20" y="-34" width="322" height="580" rx="40" fill="url(#body)"
            stroke="#3A3B41" stroke-width="1"/>
      <rect x="-6" y="-8" width="294" height="486" rx="10" fill="#000000"/>
    </g>
  </defs>

  <rect width="1440" height="720" fill="#0B0C0F"/>
  <rect width="1440" height="720" fill="url(#glow)"/>

  <!-- Left column -->
  <g font-family="Inter" fill="#FFFFFF">
    <g transform="translate(96 132)">
      <circle cx="24" cy="24" r="24" fill="#E0242B"/>
      <rect x="7.2" y="12.96" width="33.6" height="22.08" rx="3.84" fill="#FFFFFF"/>
      <path d="M17.28 30.24 C10.56 25.44 10.56 19.68 14.4 19.2 C16.08 18.96 17.28 20.16 17.28 21.36 C17.28 20.16 18.48 18.96 20.16 19.2 C24 19.68 24 25.44 17.28 30.24Z" fill="#E0242B"/>
      <rect x="25.44" y="19.2" width="11.04" height="3.36" rx="1.68" fill="#E0242B"/>
      <rect x="25.44" y="25.44" width="7.68" height="3.36" rx="1.68" fill="#E0242B"/>
      <text x="64" y="32" font-size="22" font-weight="600" letter-spacing="-0.2">Medical ID Wallet</text>
    </g>

    <text x="96" y="288" font-size="64" font-weight="700" letter-spacing="-2">Your medical ID,</text>
    <text x="96" y="362" font-size="64" font-weight="700" letter-spacing="-2">on your <tspan fill="#E0242B">Edge</tspan>.</text>

    <text x="96" y="428" font-size="22" font-weight="400" fill="#A4A7AE">Blood type, allergies, medications and emergency</text>
    <text x="96" y="460" font-size="22" font-weight="400" fill="#A4A7AE">contacts on your handlebars. Fully offline.</text>

    <g transform="translate(96 512)" font-size="15" font-weight="500" fill="#D4D6DB">
      <rect width="96" height="36" rx="18" fill="#15161A" stroke="#2C2D33"/>
      <text x="48" y="23" text-anchor="middle">Edge 540</text>
      <rect x="106" width="96" height="36" rx="18" fill="#15161A" stroke="#2C2D33"/>
      <text x="154" y="23" text-anchor="middle">Edge 840</text>
      <rect x="212" width="104" height="36" rx="18" fill="#15161A" stroke="#2C2D33"/>
      <text x="264" y="23" text-anchor="middle">Edge 1040</text>
      <rect x="326" width="104" height="36" rx="18" fill="#15161A" stroke="#2C2D33"/>
      <text x="378" y="23" text-anchor="middle">Edge 1050</text>
      <text x="446" y="23" fill="#7D8088">and more</text>
    </g>
  </g>

  <!-- Devices: QR screen behind, profile in front -->
  <g transform="translate(1078 132)" filter="url(#shadow)">
    <use xlink:href="#device"/>
    <image width="282" height="470" clip-path="url(#screen)" xlink:href="edge-screen-qr.png"/>
  </g>
  <g transform="translate(812 92)" filter="url(#shadow)">
    <use xlink:href="#device"/>
    <image width="282" height="470" clip-path="url(#screen)" xlink:href="edge-screen-profile.png"/>
  </g>
</svg>
